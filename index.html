<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORD SURVIVAL ∞</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;text-align:center}
#juego{display:none}
canvas{background:#222;border:2px solid #555}
button{padding:15px 30px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<h1>WORD SURVIVAL ∞</h1>
<button onclick="iniciar()">INICIAR</button>
<div id="juego">
<p>Nivel: <span id="nivel">1</span> | Palabras desbloqueadas: <span id="palabras">7</span></p>
<canvas id="mundo" width="640" height="480"></canvas>
</div>
<script>
const canvas=document.getElementById('mundo');
const ctx=canvas.getContext('2d');
let jugador={x:320,y:240,tam:20};
let teclas={};
let activo=false;
function iniciar(){
 document.getElementById('juego').style.display='block';
 activo=true;
 bucle();
}
document.addEventListener('keydown',e=>teclas[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>teclas[e.key.toLowerCase()]=false);
function actualizar(){
 if(teclas['w'])jugador.y-=3;
 if(teclas['s'])jugador.y+=3;
 if(teclas['a'])jugador.x-=3;
 if(teclas['d'])jugador.x+=3;
}
function dibujar(){
 ctx.clearRect(0,0,640,480);
 ctx.fillStyle='green';
 ctx.fillRect(jugador.x,jugador.y,jugador.tam,jugador.tam);
 ctx.fillStyle='white';
 ctx.fillText('Mundo generado - Base Engine',10,20);
}
function bucle(){
 if(!activo)return;
 actualizar();
 dibujar();
 requestAnimationFrame(bucle);
}
</script>
</body>
</html>
