<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>WORD SURVIVAL ∞</title><style>body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}canvas{border:2px solid #555}button{padding:15px}</style></head>
<body>
<h1>WORD SURVIVAL ∞</h1><button onclick="iniciar()">INICIAR</button><canvas id="mundo" width="640" height="480"></canvas>
<script>
const c=document.getElementById('mundo'),ctx=c.getContext('2d');
let jugador={x:0,y:0};let teclas={};let activo=false;let objetos=[];let cam={x:0,y:0};

// Biblioteca de colores del juego
const COLORES={
 pasto:'#55aa55', pastoClaro:'#5dbb63', tierra:'#8b5a2b', agua:'#2277cc', piedra:'#777777',
 madera:'#8b4513', hoja:'#174d17', fuego:'#ff6600', hielo:'#99ddff', hierro:'#444444'
};

// Sistema de texturas creadas por pixeles
function textura(tipo,x,y,tam=40){
 let color=COLORES[tipo];
 ctx.fillStyle=color;ctx.fillRect(x,y,tam,tam);
 for(let i=0;i<20;i++){
  let px=x+Math.random()*tam;
  let py=y+Math.random()*tam;
  ctx.fillStyle=variar(color);
  ctx.fillRect(px,py,2,2);
 }
}
function variar(hex){return hex;}

function generarChunk(cx,cy){
 for(let x=0;x<16;x++){
  for(let y=0;y<16;y++){
   let r=Math.random();
   if(r<0.05)objetos.push({x:(cx*16+x)*40,y:(cy*16+y)*40,tipo:'madera'});
   if(r>0.95)objetos.push({x:(cx*16+x)*40,y:(cy*16+y)*40,tipo:'piedra'});
  }
 }
}

function iniciar(){activo=true;generarChunk(0,0);bucle();}
document.addEventListener('keydown',e=>teclas[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>teclas[e.key.toLowerCase()]=false);
function actualizar(){if(teclas.w)jugador.y-=3;if(teclas.s)jugador.y+=3;if(teclas.a)jugador.x-=3;if(teclas.d)jugador.x+=3;cam.x=jugador.x-320;cam.y=jugador.y-240;}
function dibujar(){
 ctx.clearRect(0,0,640,480);
 for(let x=0;x<640;x+=40)for(let y=0;y<480;y+=40)textura('pasto',x,y);
 objetos.forEach(o=>textura(o.tipo,o.x-cam.x,o.y-cam.y));
 ctx.fillStyle='blue';ctx.fillRect(310,230,20,20);
 ctx.fillStyle='white';ctx.fillText('Motor de pixeles activo',10,20);
}
function bucle(){if(!activo)return;actualizar();dibujar();requestAnimationFrame(bucle)}
</script></body></html>
